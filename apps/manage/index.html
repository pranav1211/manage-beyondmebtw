<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Manage — Beyond Me</title>
    <link rel="stylesheet" href="./src/style.css" />
  </head>
  <body>
    <main class="shell">
      <header class="shell__header">
        <h1>Manage</h1>
        <p class="shell__sub">Beyond Me control &amp; data plane — Phase 3 skeleton</p>
      </header>
      <section class="shell__status" id="status" aria-live="polite">
        <span class="dot" aria-hidden="true"></span>
        <span id="status-text">Checking Manage API…</span>
      </section>
      <p class="shell__note">
        Frontend talks only to the Manage API (<code>/api/v1</code>). It never
        calls Argus and holds no infrastructure credentials.
      </p>
    </main>
    <script type="module" src="./src/main.js"></script>
  </body>
</html>
